name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore upload-keystore.jks \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass MyPgemSecretPass2024 \
            -keypass MyPgemSecretPass2024 \
            -dname "CN=PGEM, OU=Mobile, O=PGEM, L=Tehran, ST=Tehran, C=IR"
          
          echo "==================== BASE64 KEYSTORE START ===================="
          base64 -w 0 upload-keystore.jks
          echo ""
          echo "==================== BASE64 KEYSTORE END ======================"
