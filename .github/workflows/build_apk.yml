name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Locate project directory
        id: locate
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "project_path=." >> "$GITHUB_OUTPUT"
          else
            found_dir="$(dirname "$(find . -name "pubspec.yaml" | head -n 1)")"
            if [ -z "$found_dir" ] || [ "$found_dir" = "." ]; then
              echo "project_path=." >> "$GITHUB_OUTPUT"
            else
              echo "project_path=$found_dir" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Create Keystore and key.properties automatically
        working-directory: ${{ steps.locate.outputs.project_path }}
        run: |
          mkdir -p android/app
          
          # ساخت مستقیم کلید امنیتی
          keytool -genkeypair -v \
            -keystore android/app/upload-keystore.jks \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass MyPgemSecretPass2024 \
            -keypass MyPgemSecretPass2024 \
            -dname "CN=PGEM, OU=Mobile, O=PGEM, L=Tehran, ST=Tehran, C=IR"

          # ساخت خودکار فایل تنظیمات کلید
          cat << 'EOF' > android/key.properties
          storePassword=MyPgemSecretPass2024
          keyPassword=MyPgemSecretPass2024
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.project_path }}
        run: flutter pub get

      - name: Build Release APK
        working-directory: ${{ steps.locate.outputs.project_path }}
        run: flutter build apk --release

      - name: Find output APK
        id: find_apk
        working-directory: ${{ steps.locate.outputs.project_path }}
        run: |
          APK_PATH="$(find build/app/outputs/flutter-apk -type f -name "*release*.apk" | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            APK_PATH="$(find . -type f -name "*.apk" | head -n 1)"
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ steps.locate.outputs.project_path }}/${{ steps.find_apk.outputs.apk_path }}
