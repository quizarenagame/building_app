name: Build Flutter APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Locate project root and build
        run: |
          # پیدا کردن پوشه پروژه‌ای که pubspec.yaml در آن است
          PUB_PATH=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1)
          if [ -z "$PUB_PATH" ]; then
            echo "Error: pubspec.yaml not found anywhere in the repository!"
            exit 1
          fi
          PROJ_DIR=$(dirname "$PUB_PATH")
          echo "Found project root at: $PROJ_DIR"
          
          cd "$PROJ_DIR"
          
          # بررسی و افزودن فیلد version در صورت نبودن در pubspec.yaml برای جلوگیری از خطای versionCode
          if ! grep -q "version:" pubspec.yaml; then
            echo "Adding version to pubspec.yaml..."
            echo "version: 1.0.0+1" >> pubspec.yaml
          fi
          
          # ساخت و تنظیم گرادل 8.4
          mkdir -p android/gradle/wrapper
          PROP_FILE="android/gradle/wrapper/gradle-wrapper.properties"
          echo "Writing correct Gradle 8.4 configuration to $PROP_FILE..."
          echo "distributionBase=GRADLE_USER_HOME" > "$PROP_FILE"
          echo "distributionPath=wrapper/dists" >> "$PROP_FILE"
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-all.zip" >> "$PROP_FILE"
          echo "zipStoreBase=GRADLE_USER_HOME" >> "$PROP_FILE"
          echo "zipStorePath=wrapper/dists" >> "$PROP_FILE"

          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
