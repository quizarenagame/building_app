
name: Build Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # دریافت سورس پروژه
      - name: Checkout repository
        uses: actions/checkout@v4

      # نصب Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # نصب Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      # بررسی نصب Flutter و Dart
      - name: Check Flutter
        run: |
          flutter --version
          dart --version
          flutter doctor -v

      # نصب ابزارهای آیکون
      - name: Install icon tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick librsvg2-bin

      # ساخت آیکون اختصاصی ساختمان
      - name: Generate Building App Icon
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          cat << 'EOF' > icon.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
            <rect width="512" height="512" rx="115" fill="#12A889"/>
            <path d="M120 420h272" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round"/>
            <path d="M160 420V170l120-60v310" stroke="#FFFFFF" stroke-width="24" stroke-linejoin="round" fill="none"/>
            <path d="M280 210h80v210h-80z" stroke="#FFFFFF" stroke-width="24" fill="#0E856D"/>
            <rect x="190" y="200" width="30" height="30" rx="4" fill="#FFFFFF"/>
            <rect x="190" y="260" width="30" height="30" rx="4" fill="#FFFFFF"/>
            <rect x="190" y="320" width="30" height="30" rx="4" fill="#FFFFFF"/>
            <rect x="305" y="240" width="30" height="24" rx="4" fill="#FFFFFF"/>
            <rect x="305" y="290" width="30" height="24" rx="4" fill="#FFFFFF"/>
            <rect x="305" y="340" width="30" height="24" rx="4" fill="#FFFFFF"/>
          </svg>
          EOF

          rsvg-convert -w 48 -h 48 icon.svg -o android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          rsvg-convert -w 72 -h 72 icon.svg -o android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          rsvg-convert -w 96 -h 96 icon.svg -o android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          rsvg-convert -w 144 -h 144 icon.svg -o android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          rsvg-convert -w 192 -h 192 icon.svg -o android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      # دریافت وابستگی‌ها
      - name: Install dependencies
        run: flutter pub get

      # پاک‌سازی پروژه
      - name: Clean project
        run: flutter clean

      # دریافت دوباره وابستگی‌ها
      - name: Get dependencies
        run: flutter pub get

      # بررسی کد
      - name: Analyze Flutter Project
        run: flutter analyze --no-pub
        continue-on-error: true

      # آماده‌سازی کلید اختصاصی انتشار
      - name: Configure Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          import base64

          required = [
              "ANDROID_KEYSTORE_BASE64",
              "ANDROID_KEYSTORE_PASSWORD",
              "ANDROID_KEY_ALIAS",
              "ANDROID_KEY_PASSWORD",
          ]

          for name in required:
              if not os.environ.get(name):
                  raise SystemExit(f"Missing GitHub Secret: {name}")

          def escape_property(value):
              result = []
              for char in value:
                  code = ord(char)
                  if char == "\\":
                      result.append("\\\\")
                  elif char == "\t":
                      result.append("\\t")
                  elif char == "\n":
                      result.append("\\n")
                  elif char == "\r":
                      result.append("\\r")
                  elif char in " =:#!":
                      result.append("\\" + char)
                  elif code < 32 or code > 126:
                      result.append("\\u" + format(code, "04x"))
                  else:
                      result.append(char)
              return "".join(result)

          os.makedirs("android", exist_ok=True)

          keystore = base64.b64decode(
              os.environ["ANDROID_KEYSTORE_BASE64"],
              validate=True
          )

          if not keystore:
              raise SystemExit("Keystore file is empty")

          with open("android/upload-keystore.jks", "wb") as file:
              file.write(keystore)

          properties = {
              "storeFile": "upload-keystore.jks",
              "storePassword": os.environ["ANDROID_KEYSTORE_PASSWORD"],
              "keyAlias": os.environ["ANDROID_KEY_ALIAS"],
              "keyPassword": os.environ["ANDROID_KEY_PASSWORD"],
          }

          with open("android/key.properties", "w", encoding="ascii") as file:
              for key, value in properties.items():
                  file.write(
                      key + "=" + escape_property(value) + "\n"
                  )

          os.chmod("android/upload-keystore.jks", 0o600)
          os.chmod("android/key.properties", 0o600)

          print("Release keystore configured successfully.")
          PY

      # ساخت APK با کلید اختصاصی
      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      # بررسی وجود APK
      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      # بررسی اعتبار امضای APK
      - name: Verify APK Signature
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          APKSIGNER=$(find "$SDK/build-tools" -type f -name apksigner | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found"
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK"


      # بررسی مجوزهای نهایی برنامه
      - name: Check Final Android Permissions
        shell: bash
        run: |
          echo "Searching for merged AndroidManifest.xml..."

          FOUND=0

          for DIR in build/app/intermediates android/app/build/intermediates; do
            if [ -d "$DIR" ]; then
              while IFS= read -r FILE; do
                if [[ "$FILE" == *merged_manifest* ]]; then
                  FOUND=1
                  echo ""
                  echo "Manifest: $FILE"
                  echo "Permissions:"

                  grep -oE '<uses-permission[^>]*/>' "$FILE" || true
                fi
              done < <(find "$DIR" -type f -name AndroidManifest.xml)
            fi
          done

          if [ "$FOUND" -eq 0 ]; then
            echo "No merged manifest found."
            find build/app -type f -name AndroidManifest.xml || true
          fi

      # آپلود APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Building-App-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
