name: Build Flutter APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Locate project root and build
        run: |
          # ارتقای اجباری تمام فایل‌های gradle-wrapper.properties در کل مخزن قبل از هر کاری
          echo "Force-updating all gradle-wrapper.properties files in repository..."
          find . -name "gradle-wrapper.properties" | while read -r WRAPPER; do
            echo "Updating $WRAPPER to Gradle 8.4"
            echo "distributionBase=GRADLE_USER_HOME" > "$WRAPPER"
            echo "distributionPath=wrapper/dists" >> "$WRAPPER"
            echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-all.zip" >> "$WRAPPER"
            echo "zipStoreBase=GRADLE_USER_HOME" >> "$WRAPPER"
            echo "zipStorePath=wrapper/dists" >> "$WRAPPER"
          done

          # پیدا کردن خودکار رمینی که pubspec.yaml در آن قرار دارد
          PUB_PATH=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1)
          if [ -z "$PUB_PATH" ]; then
            echo "Error: pubspec.yaml not found anywhere in the repository!"
            exit 1
          fi
          PROJ_DIR=$(dirname "$PUB_PATH")
          echo "Found project root at: $PROJ_DIR"
          
          cd "$PROJ_DIR"

          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
